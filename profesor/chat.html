<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Aula Virtual</title>
    <link rel="icon" href="../img/logo.ico">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="../scripts/chat.js" defer></script>
    <script src="../scripts/home.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="logo EduInnovate">
        </div>
        <h1>Chat</h1>
    </header>
    <nav>
        <a href="#" class="menu-icon">&#9776;</a>
        <a href="../index.html">Cerrar Sesión</a>
    </nav>
    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="home-profesor.html">Inicio</a></li>
                <li><a href="gestionar-cursos.html">Gestionar Cursos</a></li>
                <li><a href="chats.html" class="active">Mensajes</a></li>
                <li><a href="perfil.html">Ver Perfil</a></li>
                <li><a href="anuncios.html">Anuncios</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <section class="chat-section">
                <h2>Chat del Curso</h2>
                <div class="chat-box">
                    <div class="messages" id="message-container">
                        <!-- Mensajes serán añadidos aquí -->
                    </div>
                    <form id="message-form">
                        <input type="text" id="message-input" placeholder="Escribe un mensaje..." required>
                        <input type="file" id="file-input" style="display: none;">
                        <button type="button" id="attach-button">
                            <i class="fas fa-folder"></i>
                        </button>
                        <button type="button" id="cancel-button" style="display: none;">
                            <i class="fas fa-times"></i>
                        </button>
                        <span id="file-name"></span>
                        <button type="submit" id="send-button">Enviar</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <footer>
        <p>&copy; 2024 Aula Virtual. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
