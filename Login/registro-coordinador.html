<!DOCTYPE html>

    <link rel="stylesheet" href="../styles.css">
    <meta name="description" content="Registro de Coordinador en EduInnovate+">
    <meta name="keywords" content="Registro, Coordinador, EduInnovate, Aula Virtual">
    <script src="../scripts.js"></script>
    <link rel="icon" href="../img/logo.ico">
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="logo">
                <img src="../img/logo.jpg" alt="logo EduInnovate">
            </div>
            <h1>EduInnovate+</h1>
        </header>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="../caracteristicas.html">Características</a>
            <a href="../equipo.html">Equipo</a>
            <a href="../contacto.html">Contacto</a>
        </nav>
        <div class="content-wrapper">
            <section class="content">
                <h3>Registro de Coordinador</h3>
                <div class="login-section">
                    <form id="registro-form" action="../php/registro_coordinador.php" method="POST">
                        <label for="cedula">Cédula:</label>
                        <input type="text" id="cedula" name="cedula" required>
                    
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                    
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    
                        <label for="confirm-password">Confirmar Contraseña:</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    
                        <input type="submit" value="Registrarse">
                    </form>
                </div>
            </section>
        </div>
        <footer>

        </footer>
