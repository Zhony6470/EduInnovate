<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Carrera de Estudio - Coordinador</title>
    <link rel="icon" href="../img/logo.ico">
    <link rel="stylesheet" href="../styles/home.css">
    <script src="../scripts/home.js" defer></script>
    <script src="../scripts/abrir-carrera.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="logo EduInnovate">
        </div>
        <h1>Abrir Carrera</h1>
    </header>
    <nav>
        <a href="#" class="menu-icon">&#9776;</a>
        <a href="../index.html">Cerrar Sesión</a>
    </nav>
    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="home-coordinador.html">Inicio</a></li>
                <li><a href="gestionar-estudiantes.html">Gestionar Estudiantes</a></li>
                <li><a href="gestionar-profesores.html">Gestionar Profesores</a></li>
                <li><a href="carreras-estudio.html" class="active">Carreras de Estudio</a></li>
                <li><a href="perfil.html">Ver Perfil</a></li>
                <li><a href="anuncios.html">Anuncios</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <section class="content-section">
                <h2>Abrir Carrera de Estudio</h2>
                <form id="open-career-form">
                    <div class="form-group">
                        <label for="carrera-nombre">Nombre de la Carrera:</label>
                        <input type="text" id="carrera-nombre" name="carrera-nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="search-student">Buscar Estudiantes:</label>
                        <input type="text" id="search-student" placeholder="Buscar estudiante por nombre...">
                    </div>
                    <ul id="student-list">
                        <!-- Aquí se mostrarán los estudiantes encontrados -->
                    </ul>
                    <div id="selected-students">
                        <h3>Estudiantes Seleccionados</h3>
                        <ul id="selected-student-list">
                            <!-- Aquí se mostrarán los estudiantes seleccionados -->
                        </ul>
                    </div>
                    <div class="form-group">
                        <input type="submit" value="Guardar">
                    </div>
                    <div id="message" style="display: none; color: green; font-weight: bold; text-align: center; margin-top: 20px;">
                        Carrera de estudio creada exitosamente.
                    </div>
                </form>
            </section>
        </main>
    </div>
    <footer>
        <p>&copy; 2024 Aula Virtual. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
