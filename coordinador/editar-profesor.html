<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Profesor - Coordinador</title>
    <link rel="icon" href="../img/logo.ico">
    <link rel="stylesheet" href="../styles/home.css">
    <script src="../scripts/editar-profesor.js" defer></script>
    <script src="../scripts/home.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="logo EduInnovate">
        </div>
        <h1>Edición</h1>
    </header>
    <nav>
        <a href="#" class="menu-icon">&#9776;</a>
        <a href="../index.html">Cerrar Sesión</a>
    </nav>
    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="home-coordinador.html">Inicio</a></li>
                <li><a href="gestionar-estudiantes.html">Gestionar Estudiantes</a></li>
                <li><a href="gestionar-profesores.html" class="active">Gestionar Profesores</a></li>
                <li><a href="carreras-estudio.html">Carreras de Estudio</a></li>
                <li><a href="perfil.html">Ver Perfil</a></li>
                <li><a href="anuncios.html">Anuncios</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <section class="content-section">
                <h2>Editar Profesor</h2>
                <form id="edit-professor-form">
                    <div class="form-group">
                        <label for="cedula">Cédula:</label>
                        <input type="text" id="cedula" name="cedula" readonly>
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>
                    <input type="submit" value="Guardar Cambios">
                </form>
            </section>
        </main>
    </div>
    <footer>
        <p>&copy; 2024 Aula Virtual. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
