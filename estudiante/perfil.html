<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Estudiante</title>
    <link rel="icon" href="../img/logo.ico">
    <link rel="stylesheet" href="../styles/home.css">
    <script src="../scripts/home.js" defer></script>
    <script src="../scripts/perfil-estudiante.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="logo EduInnovate">
        </div>
        <h1>Perfil</h1>
    </header>
    <nav>
        <a href="#" class="menu-icon">&#9776;</a>
        <a href="../index.html">Cerrar Sesión</a>
    </nav>
    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="home-estudiante.html">Inicio</a></li>
                <li><a href="mis-cursos.html">Mis Cursos</a></li>
                <li><a href="perfil.html" class="active">Ver Perfil</a></li>
                <li><a href="anuncios.html">Anuncios</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <section class="content-section">
                <h2>Buscar Datos</h2>
                <form id="search-profile-form">
                    <label for="cedula">Cédula:</label>
                    <input type="text" id="cedula" name="cedula" required>
                    <input type="submit" value="Buscar">
                </form>
                <h2>Datos del Estudiante</h2>
                <form id="update-profile-form">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Nueva Contraseña:</label>
                        <input type="password" id="new-password" name="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirm-new-password">Confirmar Nueva Contraseña:</label>
                        <input type="password" id="confirm-new-password" name="confirm-new-password">
                    </div>
                    <input type="submit" value="Actualizar datos">
                </form>
            </section>
        </main>
    </div>
    <footer>
        <p>&copy; 2024 Aula Virtual. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
